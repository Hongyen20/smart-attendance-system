name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & Build
        working-directory: backend
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Test
        working-directory: backend
        run: dotnet test --no-restore || true   # bỏ "|| true" khi có unit test thật

  package-and-deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker stop attendance-api || true
            docker rm attendance-api || true
            docker run -d --name attendance-api --restart unless-stopped \
              -p 5000:5000 \
              -e MONGODB_CONNECTION_STRING='${{ secrets.MONGODB_CONNECTION_STRING }}' \
              ${{ env.IMAGE_NAME }}:latest