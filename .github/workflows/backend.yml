name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  deploy:
    name: Deploy ASP.NET Core Backend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "========================================"
            echo "Deploying Backend"
            echo "========================================"

            cd ~/smart-attendance-system

            echo ">>> Sync latest source code"
            git fetch origin main
            git reset --hard origin/main
            echo ">>> Go to backend"
            cd backend

            echo ">>> Build Docker image"
            docker build -t attendance-api .

            echo ">>> Stop old container"
            docker stop attendance-api 2>/dev/null || true

            echo ">>> Remove old container"
            docker rm attendance-api 2>/dev/null || true

            echo ">>> Start new container"
            docker run -d \
              --name attendance-api \
              --restart unless-stopped \
              --env-file .env.production \
              -p 8080:8080 \
              attendance-api

            echo ">>> Show container status"
            docker ps --filter "name=attendance-api"

            echo ">>> Show recent logs"
            docker logs --tail 50 attendance-api

            echo "========================================"
            echo "Backend deployment completed"
            echo "========================================"